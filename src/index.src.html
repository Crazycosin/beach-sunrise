// pr：渲染分辨率；sky：天空相对画面的分辨率（<1 时先画到小纹理再铺满）；level：着色器细节
const QUALITY = {
  high:   { pr: Math.min(devicePixelRatio, 1.5),     sky: 1,    level: 2, shadow: 2048 },
  medium: { pr: Math.min(devicePixelRatio, 1) * 0.8, sky: 0.5,  level: 1, shadow: 2048 },
  low:    { pr: Math.min(devicePixelRatio, 1) * 0.6, sky: 0.35, level: 0, shadow: 1024 },
};
const skyScene = new THREE.Scene();
let skyRT = null, quality = null;
function resizeSkyRT() {
  if (!skyRT) return;
  const v = renderer.getDrawingBufferSize(new THREE.Vector2());
  const s = QUALITY[quality].sky;
  skyRT.setSize(Math.max(1, Math.round(v.x * s)), Math.max(1, Math.round(v.y * s)));
}
function applyQuality(name) {
  if (!QUALITY[name]) name = 'medium';
  const q = QUALITY[name];
  quality = name;
  renderer.setPixelRatio(q.pr);
  renderer.setSize(innerWidth, innerHeight);
  for (const m of qualityMats) { m.defines = { ...m.defines, QUALITY: q.level }; m.needsUpdate = true; }
  if (q.sky < 1) {
    // 天空和云很柔和，低分辨率渲染再放大几乎看不出差别，却能省下大量像素计算
    skyRT ??= new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });
    skyScene.add(sky);
    resizeSkyRT();
    scene.background = skyRT.texture;
  } else {
    scene.add(sky);
    scene.background = null;

  if (sunLight.shadow.mapSize.x !== q.shadow) {
    sunLight.shadow.mapSize.set(q.shadow, q.shadow);
    if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
  }
  document.querySelectorAll('button[data-q]').forEach(b => b.classList.toggle('on', b.dataset.q === name));
  try { localStorage.setItem('beach-quality', name); } catch {}
}

function phaseName(th, e, hours) {
  const morning = th < Math.PI / 2;
  if (e < -0.12) return '夜晚';
  if (e < 0.0) return morning ? '黎明' : '黄昏';
  if (e < 0.12) return morning ? '日出' : '日落';
  if (hours >= 11 && hours < 13) return '正午';
  return morning ? '上午' : '下午';
}

  elapsed += dt;
  if (realtime && !scrubbing) p = clockP();
  else if (playing && !scrubbing) p = (p + dt * speed / CYCLE) % 1;
  // 场景时间流速（相对 1× 的倍数）；实时模式下一天 86400 秒
  const timeRate = realtime ? CYCLE / 86400 : (playing && !scrubbing ? speed : 0);
  const { th, e } = updateDayCycle(p);
  U.uTime.value = elapsed;
  // 云跟着延时摄影的节奏飘；暂停时只是缓慢漂移。云量也会慢慢变化，有时晴朗有时多云
  cloudTime += dt * (realtime ? 0.2 : playing && !scrubbing ? speed : 0.25) * (0.5 + 0.5 * W.wind);   // 风大云也跑得快
  U.uCloudTime.value = cloudTime;
  updateWeather(dt, Math.min(1, Math.max(0, 0.55 + 0.3 * Math.sin(cloudTime * 0.013 + 1.0) + 0.15 * Math.sin(cloudTime * 0.031))), e);

  // 整个树冠随风摇（叶片自身的抖动在着色器里）
  const wind = (1 + 0.5 * Math.sin(elapsed * 0.23)) * W.wind;
  for (const c of crowns) {
    const gust = 0.04 * (W.wind - 1) * (1 + Math.sin(elapsed * 0.9 + c.seed * 0.7));   // 大风时整体被吹向陆地一侧
    c.crown.rotation.z = Math.sin(elapsed * 0.8 * (0.7 + 0.3 * W.wind) + c.seed) * 0.03 * wind;
    c.crown.rotation.x = Math.sin(elapsed * 0.6 + c.seed * 1.3) * 0.02 * wind + gust;
  }

  const eventRate = realtime || !playing ? 1 : speed;   // 鸟群、海鸥出现的频率
  updateBirds(dt, e, eventRate);
  for (const c of critters) c.update(dt, elapsed);
  updateGull(dt, e, eventRate);
  updateTurtles(dt, dt * timeRate, e);

  controls.update();
  // 沙丘起伏后，防止镜头钻进沙里
  const minCamY = sandMeshHeight(camera.position.x, camera.position.z) + 1.2;
  if (camera.position.y < minCamY) camera.position.y = minCamY;
  sky.position.copy(camera.position);
  if (scene.background) {
    renderer.setRenderTarget(skyRT);
    renderer.render(skyScene, camera);
    renderer.setRenderTarget(null);
  }
  renderer.render(scene, camera);
  if (!window.__sceneStarted) {
    window.__sceneStarted = true;
    document.getElementById('status').style.display = 'none';
  }

  fpsFrames++;
  const nowMs = performance.now();
  if (nowMs - fpsLast > 500) {
    elFps.textContent = Math.round(fpsFrames * 1000 / (nowMs - fpsLast)) + ' fps';
    fpsFrames = 0;
    fpsLast = nowMs;
  }

  if (!scrubbing) slider.value = Math.round(p * 1000);
  const hours = ((6 + th / Math.PI * 12) % 24 + 24) % 24;
  const hh = Math.floor(hours), mm = Math.floor((hours - hh) * 60);
  elClock.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  elPhase.textContent = phaseName(th, e, hours);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  resizeSkyRT();
});
</script>
</body>
</html>
